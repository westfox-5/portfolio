name: Publish Docker image to GHCR

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full image name (e.g., ghcr.io/OWNER/repo)'
        required: false
        default: ''
      tags:
        description: 'Comma-separated tags (e.g., latest,sha)'
        required: false
        default: 'latest'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        default: 'Dockerfile'
      context:
        description: 'Build context'
        required: false
        default: '.'
      platforms:
        description: 'Platforms (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'

  # Also publish when a Git tag is pushed (e.g., v1.2.3 or any tag)
  push:
    tags:
      - 'v*'
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prepare_tags
        run: |
          set -eu
          # If this run was triggered by pushing a tag, use that tag name
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && echo "${GITHUB_REF}" | grep -q '^refs/tags/'; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAGS="$TAG"
          else
            TAGS="${{ github.event.inputs.tags }}"
            if [ -z "$TAGS" ]; then TAGS=latest; fi
          fi

          IMAGE="${{ github.event.inputs.image }}"
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/${{ github.repository_owner }}/portfolio"; fi
          out=""
          IFS=',' read -ra arr <<< "$TAGS"
          for t in "${arr[@]}"; do
            t="$(echo "$t" | xargs)"
            if [ -n "$out" ]; then out="$out,${IMAGE}:$t"; else out="${IMAGE}:$t"; fi
          done
          echo "image_tags=$out" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.event.inputs.context }}
          file: ${{ github.event.inputs.dockerfile }}
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          tags: ${{ steps.prepare_tags.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published image tags
        run: |
          echo "Published: ${{ steps.prepare_tags.outputs.image_tags }}"